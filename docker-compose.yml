version: '3.7'

services:
  fastapi:
    container_name: fastapi
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./models:/models
    networks:
      - deploy_network

  streamlit:
    container_name: streamlit
    build: ./frontend
    depends_on:
      - fastapi
    ports:
      - "8501:8501"
    networks:
      - deploy_network
    environment:
      - API_URL=http://fastapi:8000/

networks:
  deploy_network:
    driver: bridge
