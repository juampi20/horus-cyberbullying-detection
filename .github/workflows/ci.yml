name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: ruff check
        run: uvx ruff@0.16.1 check --config .code_quality/ruff.toml backend frontend
      - name: ruff format --check
        run: uvx ruff@0.16.1 format --check --config .code_quality/ruff.toml backend frontend

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install backend dependencies
        working-directory: backend
        run: |
          uv venv .venv --python 3.11
          uv pip install --python .venv/bin/python -r requirements.txt
          uv pip install --python .venv/bin/python \
            "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.7.1/en_core_web_sm-3.7.1-py3-none-any.whl"
      - name: Run backend suite
        working-directory: backend
        run: .venv/bin/python -m pytest tests -q

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          uv venv .venv --python 3.9
          uv pip install --python .venv/bin/python -r requirements.txt
          # The image ships pytest via requirements.txt; CI installs the runner
          # itself so this job does not depend on the app requirements.
          uv pip install --python .venv/bin/python "pytest==8.4.2"
      - name: Run frontend suite
        working-directory: frontend
        run: .venv/bin/python -m pytest tests -q
