# Configuración central del pipeline de investigación.
# Los valores reflejan los parámetros reales usados en los notebooks
# (etapas 00-03); esta versión es de documentación, sin Hydra.
# El proyecto es bilingüe: rutas e identificadores en inglés, comentarios en español.

paths:
  raw: data/01_raw/cyberbullying.csv
  preprocessed: data/02_intermediate/cyberbullying_preprocessed.csv
  models_results: data/08_reporting/models_results.csv
  models_dir: models/

preprocessing:
  # Modelo de lenguaje usado para normalización (lematización, stopwords, etc.)
  spacy_model: en_core_web_sm
  # La normalización descarta filas cuyo texto queda vacío tras el preproceso
  drop_empty_text: true

features:
  # Vectorizador TF-IDF del notebook de ingeniería de features (04, referencial)
  min_df: 0.01
  max_features: 1000
  # El pipeline de la etapa de modelado usa TfidfVectorizer() con defaults

modeling:
  # Partición estratificada 80/20, reproducible
  test_size: 0.2
  random_state: 1
  stratify: true
  # Umbral de decisión explícito para la clase positiva
  decision_threshold: 0.5
  pos_label: 1
  # Validación cruzada sobre el pipeline completo (tfidf + clasificador)
  cross_validation:
    cv: 5
    scoring: f1

  # Parámetros de los 9 modelos (extraídos del notebook 03_train_compare_models.ipynb).
  # Donde no se especifican, se usan los valores por defecto de scikit-learn 1.2.2
  # y xgboost 2.0.3 (alineados con src_fastapi/requirements.txt).
  models:
    logistic_regression:
      solver: lbfgs
      multi_class: multinomial
      max_iter: 1000
    k_nearest_neighbors: {}
    decision_tree: {}
    svm_linear:
      kernel: linear
      probability: true
    svm_rbf:
      kernel: rbf
      probability: true
    random_forest:
      random_state: 42
    gradient_boosting: {}
    xgboost: {}
    neural_network:
      hidden_layer_sizes: [150, 100, 50]
      activation: relu
      solver: adam
      max_iter: 300
      random_state: 1
